[project]
name = "hasar"
version = "0.1.0"
description = "Building damage mapping from pre-disaster optical and post-disaster SAR imagery."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch",
    "timm",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hasar"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --durations=5"
