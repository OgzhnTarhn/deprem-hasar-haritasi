[project]
name = "hasar"
version = "0.1.0"
description = "Building damage mapping from pre-disaster optical and post-disaster SAR imagery."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tifffile>=2023.1",
    "huggingface_hub>=0.20",
    "scipy>=1.11",
    "pillow>=10",
]

[project.scripts]
hasar = "hasar.cli:main"

[project.optional-dependencies]
train = [
    "torch",
    "timm",
    "einops",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "nbstripout>=0.7",
]
# Yalnız scripts/arastirma/ betikleri için; paket ve testler kullanmaz.
arastirma = [
    "pyproj>=3.6",
    "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hasar"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["third_party", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["hasar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --durations=5"
